services:
  caliarena-postgres:
    container_name: caliarena-postgres
    image: caliarena-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"

  caliarena-jvm:
    container_name: caliarena-jvm
    hostname: caliarena-jvm
    image: caliarena-jvm
    environment:
      PORT: 8080
      DB_URL: ${DB_URL}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"

  nginx:
    container_name: caliarena-nginx
    image: caliarena-nginx
    ports:
      - "4000:4000"
    depends_on:
      - caliarena-jvm